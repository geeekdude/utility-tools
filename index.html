<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tool Register — Prateek Kumar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B1D1F;
    --panel: #242628;
    --border: #313335;
    --paper: #EDE7DB;
    --paper-border: #c9c0a8;
    --brass: #C08A3E;
    --text: #F2EFE9;
    --muted: #9A9D9F;
    --live: #6B8E5A;
    --proto: #C08A3E;
    --archived: #6E6A62;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(#2c2e30 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }
  .container {
    position: relative;
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    z-index: 1;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 28px;
  }
  .header-left { max-width: 560px; }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--brass);
    margin-bottom: 10px;
    font-weight: 500;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .subtitle { font-size: 15px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .header-stats { display: flex; align-items: center; gap: 20px; font-family: 'JetBrains Mono', monospace; }
  .stat-block { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 600; }
  .stat-num.live { color: var(--live); }
  .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-top: 2px; }
  .stat-divider { width: 1px; height: 32px; background: var(--border); }

  .plate {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--brass);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 24px;
  }
  .plate-icon {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border); flex-shrink: 0;
    font-size: 15px;
  }
  .plate-name { font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600; }
  .plate-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 24px; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; min-width: 220px; flex: 1 1 220px;
  }
  .search-box input {
    background: transparent; border: none; outline: none; color: var(--text);
    font-size: 14px; width: 100%; font-family: 'Inter', sans-serif;
  }
  .filter-row { display: flex; gap: 8px; overflow-x: auto; flex: 2 1 320px; padding-bottom: 2px; }
  .filter-chip {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-family: 'Inter', sans-serif;
    cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
  }
  .filter-chip.active { background: var(--brass); border-color: var(--brass); color: var(--bg); font-weight: 600; }
  .add-button {
    display: flex; align-items: center; gap: 6px;
    background: var(--text); color: var(--bg); border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 20px; border: 1px dashed var(--border); border-radius: 12px; gap: 12px;
  }
  .empty-state p { color: #7d8082; font-size: 14px; text-align: center; max-width: 320px; margin: 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .card {
    position: relative; background: var(--paper); color: #26241f; border-radius: 10px;
    padding: 22px 18px 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    display: flex; flex-direction: column; animation: fadeUp 0.35s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .card-hole {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: var(--bg);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .card-top-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; margin-bottom: 14px; }
  .case-id { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #8a8474; letter-spacing: 0.04em; }
  .status-badge {
    display: flex; align-items: center; gap: 5px; font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace; border: 1px solid; border-radius: 999px;
    padding: 3px 8px; font-weight: 600;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; margin: 0; line-height: 1.25; }
  .card-category { font-size: 11.5px; color: #7a6f52; font-family: 'JetBrains Mono', monospace; margin-top: 4px; margin-bottom: 10px; }
  .card-desc { font-size: 13.5px; line-height: 1.5; color: #4a463d; margin: 0; flex: 1; }
  .stack-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .stack-tag { font-size: 10.5px; font-family: 'JetBrains Mono', monospace; background: #dcd4bf; color: #4a4636; border-radius: 4px; padding: 3px 7px; }
  .tear-line { border-top: 1.5px dashed var(--paper-border); margin: 16px 0 12px; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; }
  .date-added { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #9a927a; }
  .card-actions { display: flex; gap: 4px; }
  .icon-btn {
    display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    border-radius: 6px; border: none; background: transparent; color: #5c5643; cursor: pointer;
    text-decoration: none; font-size: 14px;
  }
  .icon-btn:hover { background: rgba(0,0,0,0.06); }

  .confirm-overlay {
    position: absolute; inset: 0; background: rgba(237,231,219,0.97); border-radius: 10px;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px; text-align: center;
  }
  .confirm-overlay.show { display: flex; }
  .confirm-overlay p { font-size: 13.5px; color: #3a362c; margin: 0; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-cancel { background: transparent; border: 1px solid #b8ae92; color: #4a463d; border-radius: 6px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
  .confirm-delete { background: #a5482f; border: none; color: #fff; border-radius: 6px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; font-weight: 600; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,10,10,0.6); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-header h2 { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; margin: 0; }
  .close-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px; font-size: 18px; }
  .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  label { font-size: 11.5px; font-family: 'JetBrains Mono', monospace; color: var(--muted); letter-spacing: 0.04em; }
  input[type=text], textarea, select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px;
    color: var(--text); font-size: 13.5px; font-family: 'Inter', sans-serif; outline: none; width: 100%;
  }
  textarea { min-height: 80px; resize: vertical; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  .cancel-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .save-btn { background: var(--brass); border: none; color: var(--bg); border-radius: 7px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--brass); outline-offset: 2px;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <div class="kicker">GEHU · COMPUTER SCIENCE &amp; ENGINEERING</div>
      <h1>Tool Register</h1>
      <p class="subtitle">A running log of the utilities built for GEHU coursework and admin.</p>
    </div>
    <div class="header-stats">
      <div class="stat-block">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">logged</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-block">
        <div class="stat-num live" id="statLive">0</div>
        <div class="stat-label">live</div>
      </div>
    </div>
  </header>

  <div class="plate">
    <div class="plate-icon">👤</div>
    <div>
      <div class="plate-name">Prateek Kumar</div>
      <div class="plate-meta">Assistant Professor · Computer Science &amp; Engineering</div>
      <div class="plate-meta">Graphic Era Hill University, Dehradun</div>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search tools, stack, notes…" />
    </div>
    <div class="filter-row" id="filterRow"></div>
    <button class="add-button" id="addBtn">+ Log a tool</button>
  </div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <p id="emptyText">Nothing logged yet.</p>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Log a new tool</h2>
      <button class="close-btn" id="closeModal">✕</button>
    </div>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="fName" placeholder="e.g. Attendance VCF Generator" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="fDesc" placeholder="What does it do, and who's it for?"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select id="fCategory"></select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus"></select>
      </div>
    </div>
    <div class="form-group">
      <label>Stack (comma separated)</label>
      <input type="text" id="fStack" placeholder="e.g. pdf-lib, SheetJS, JSZip" />
    </div>
    <div class="form-group">
      <label>Link (relative or full URL)</label>
      <input type="text" id="fLink" placeholder="pdfsplit/  or  https://…" />
    </div>
    <div class="modal-footer">
      <button class="cancel-btn" id="cancelBtn">Cancel</button>
      <button class="save-btn" id="saveBtn">Add to register</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "tool-registry";
  const CATEGORIES = ["PDF / Docs", "Email / Automation", "Data / Excel", "Web App", "Course Material", "Other"];
  const STATUSES = ["Live", "Prototype", "Archived"];
  const STATUS_COLOR = { Live: "#6B8E5A", Prototype: "#C08A3E", Archived: "#6E6A62" };

  const SEED_TOOLS = [
    {
      id: "seed-1",
      name: "PDF Splitter & Renamer",
      description: "Splits a compiled PDF into per-student files and renames each one from an Excel roll-number match. Runs fully client-side, then packages the batch into a ZIP.",
      category: "PDF / Docs",
      stack: ["pdf.js", "pdf-lib", "SheetJS", "JSZip"],
      status: "Live",
      link: "pdfsplit/",
      dateAdded: "2026-01-15",
      caseId: "GEHU-TOOL-001"
    },
    {
      id: "seed-2",
      name: "UFM Decision Mailer",
      description: "Sends personalised UFM Committee Decision letters to students straight from the GEHU Microsoft 365 account, no desktop Outlook required.",
      category: "Email / Automation",
      stack: ["MSAL.js", "Microsoft Graph API"],
      status: "Live",
      link: "bulkmail/",
      dateAdded: "2026-02-03",
      caseId: "GEHU-TOOL-002"
    }
  ];

  let tools = [];
  let activeCategory = "All";
  let query = "";
  let editingId = null;

  function loadTools() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tools = raw ? JSON.parse(raw) : SEED_TOOLS.slice();
      if (!raw) saveTools();
    } catch (e) {
      tools = SEED_TOOLS.slice();
    }
  }
  function saveTools() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tools));
  }
  function nextCaseId() {
    const nums = tools.map(t => parseInt((t.caseId || "").split("-").pop(), 10)).filter(n => !isNaN(n));
    const next = (nums.length ? Math.max(...nums) : 0) + 1;
    return "GEHU-TOOL-" + String(next).padStart(3, "0");
  }

  function renderFilters() {
    const row = document.getElementById("filterRow");
    row.innerHTML = "";
    ["All", ...CATEGORIES].forEach(c => {
      const btn = document.createElement("button");
      btn.className = "filter-chip" + (activeCategory === c ? " active" : "");
      btn.textContent = c;
      btn.onclick = () => { activeCategory = c; render(); };
      row.appendChild(btn);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function render() {
    renderFilters();
    const grid = document.getElementById("grid");
    const empty = document.getElementById("emptyState");
    const emptyText = document.getElementById("emptyText");

    const q = query.trim().toLowerCase();
    const filtered = tools.filter(t => {
      const matchesCategory = activeCategory === "All" || t.category === activeCategory;
      const matchesQuery = !q || t.name.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || t.stack.join(" ").toLowerCase().includes(q);
      return matchesCategory && matchesQuery;
    });

    document.getElementById("statTotal").textContent = tools.length;
    document.getElementById("statLive").textContent = tools.filter(t => t.status === "Live").length;

    grid.innerHTML = "";
    if (filtered.length === 0) {
      empty.style.display = "flex";
      emptyText.textContent = tools.length === 0
        ? "Nothing logged yet. Add the first tool to start the register."
        : "No tools match this search or filter.";
      return;
    }
    empty.style.display = "none";

    filtered.forEach((tool, i) => {
      const color = STATUS_COLOR[tool.status] || "#8B8F92";
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = (i * 0.04) + "s";
      card.innerHTML = `
        <div class="card-hole"></div>
        <div class="card-top-row">
          <span class="case-id">${escapeHtml(tool.caseId || "—")}</span>
          <span class="status-badge" style="color:${color}; border-color:${color}55;">
            <span class="status-dot" style="background:${color};"></span>${escapeHtml(tool.status)}
          </span>
        </div>
        <h3>${escapeHtml(tool.name)}</h3>
        <div class="card-category">${escapeHtml(tool.category)}</div>
        <p class="card-desc">${escapeHtml(tool.description || "No description yet.")}</p>
        ${tool.stack && tool.stack.length ? `<div class="stack-row">${tool.stack.map(s => `<span class="stack-tag">${escapeHtml(s)}</span>`).join("")}</div>` : ""}
        <div class="tear-line"></div>
        <div class="card-footer">
          <span class="date-added">${escapeHtml(tool.dateAdded)}</span>
          <div class="card-actions">
            ${tool.link ? `<a class="icon-btn" href="${escapeHtml(tool.link)}" target="_blank" rel="noopener noreferrer" title="Open tool">↗</a>` : ""}
            <button class="icon-btn" title="Edit" onclick="openEdit('${tool.id}')">✎</button>
            <button class="icon-btn" title="Delete" onclick="askDelete('${tool.id}', this)">🗑</button>
          </div>
        </div>
        <div class="confirm-overlay">
          <p>Remove this tool from the register?</p>
          <div class="confirm-actions">
            <button class="confirm-cancel" onclick="cancelDelete(this)">Keep it</button>
            <button class="confirm-delete" onclick="doDelete('${tool.id}')">Remove</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function askDelete(id, btn) {
    const overlay = btn.closest(".card").querySelector(".confirm-overlay");
    overlay.classList.add("show");
  }
  function cancelDelete(btn) {
    btn.closest(".confirm-overlay").classList.remove("show");
  }
  function doDelete(id) {
    tools = tools.filter(t => t.id !== id);
    saveTools();
    render();
  }

  function populateSelect(id, options) {
    const sel = document.getElementById(id);
    sel.innerHTML = options.map(o => `<option value="${o}">${o}</option>`).join("");
  }

  function openModal() {
    document.getElementById("modalBackdrop").classList.add("show");
    document.getElementById("fName").focus();
  }
  function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("show");
    editingId = null;
  }

  function openAdd() {
    editingId = null;
    document.getElementById("modalTitle").textContent = "Log a new tool";
    document.getElementById("saveBtn").textContent = "Add to register";
    document.getElementById("fName").value = "";
    document.getElementById("fDesc").value = "";
    document.getElementById("fCategory").value = CATEGORIES[0];
    document.getElementById("fStatus").value = "Live";
    document.getElementById("fStack").value = "";
    document.getElementById("fLink").value = "";
    openModal();
  }

  function openEdit(id) {
    const tool = tools.find(t => t.id === id);
    if (!tool) return;
    editingId = id;
    document.getElementById("modalTitle").textContent = "Edit tool";
    document.getElementById("saveBtn").textContent = "Save changes";
    document.getElementById("fName").value = tool.name;
    document.getElementById("fDesc").value = tool.description;
    document.getElementById("fCategory").value = tool.category;
    document.getElementById("fStatus").value = tool.status;
    document.getElementById("fStack").value = tool.stack.join(", ");
    document.getElementById("fLink").value = tool.link || "";
    openModal();
  }

  function saveDraft() {
    const name = document.getElementById("fName").value.trim();
    if (!name) return;
    const stackArr = document.getElementById("fStack").value.split(",").map(s => s.trim()).filter(Boolean);
    const payload = {
      name,
      description: document.getElementById("fDesc").value.trim(),
      category: document.getElementById("fCategory").value,
      status: document.getElementById("fStatus").value,
      stack: stackArr,
      link: document.getElementById("fLink").value.trim()
    };
    if (editingId) {
      tools = tools.map(t => t.id === editingId ? { ...t, ...payload } : t);
    } else {
      tools.unshift({
        id: "tool-" + Date.now(),
        ...payload,
        dateAdded: new Date().toISOString().slice(0, 10),
        caseId: nextCaseId()
      });
    }
    saveTools();
    closeModal();
    render();
  }

  document.getElementById("addBtn").onclick = openAdd;
  document.getElementById("closeModal").onclick = closeModal;
  document.getElementById("cancelBtn").onclick = closeModal;
  document.getElementById("saveBtn").onclick = saveDraft;
  document.getElementById("modalBackdrop").addEventListener("click", (e) => {
    if (e.target.id === "modalBackdrop") closeModal();
  });
  document.getElementById("searchInput").addEventListener("input", (e) => {
    query = e.target.value;
    render();
  });

  populateSelect("fCategory", CATEGORIES);
  populateSelect("fStatus", STATUSES);
  loadTools();
  render();
</script>
</body>
</html>
